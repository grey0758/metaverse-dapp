services:
  game-server:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: ["corepack", "pnpm", "--filter", "@metaverse/game-server", "dev"]
    environment:
      GAME_HOST: 0.0.0.0
      GAME_PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - ..:/workspace

  api:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: ["corepack", "pnpm", "--filter", "@metaverse/api", "dev"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8788"
      WEB_ORIGIN: http://127.0.0.1:5173
    ports:
      - "8788:8788"
    volumes:
      - ..:/workspace
